[project]
name = "tmux-path-store"
version = "2026.10.1"
description = "Uses the Tmux window name as an index into a list of stored directory paths and files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = true

[project.scripts]
tmux-path-store = "tmux_path_store:cli"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.29",
]
