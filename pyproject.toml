[project]
name = "tmux-path-store"
version = "2026.10.5"
description = "Directory and file bookmarks for each tmux window."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/smprather/tmux-path-store"
Repository = "https://github.com/smprather/tmux-path-store"
Issues = "https://github.com/smprather/tmux-path-store/issues"

[tool.uv]
package = true

[project.scripts]
tmux-path-store = "tmux_path_store:cli"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.29",
]
