name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TPS_REQUIRED_SHELLS: "bash sh dash ksh mksh zsh fish csh tcsh nu pwsh xonsh"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: Install system test shells and tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bash dash zsh fish tcsh ksh mksh tmux
      - name: Install local test runtimes
        run: bash .github/scripts/install-test-shells.sh
      - run: uv run ruff check tmux_path_store tests
      - run: uv run ty check tmux_path_store tests
      - name: Unit, shell, and tmux integration tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
